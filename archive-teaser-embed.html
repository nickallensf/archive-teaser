<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Teaser</title>
<style>
  html, body { margin: 0; height: 100%; background: #AAA8C2; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #AAA8C2; }
</style>
</head>
<body>
  <!-- Keep this file and archive-teaser.mp4 in the same folder on your host. -->
  <video autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback>
    <source src="archive-teaser.mp4" type="video/mp4">
  </video>
</body>
</html>
